<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table-form</title>
</head>
<body>
    <center>
        <table>
            
        <form action="https://www.instagram.com/?hl=en">
    <h1><B><i>INSTAGRAM LOGIN PAGE</i></B></h1>
    <hr>
    <tr>
        <td><b>UserName:</b> </td>
    <td><input type="text"  placeholder="enter your  Username" required><br><br></td>
    </tr>
    
    <tr>
    <td><b>Password:</b></td>
    <td> <input type="password"  placeholder="enter your password "required><br><br></td>
</tr>

<td><b>Mobile No.:</b></td>
    <td> <input type="number"  placeholder="enter your Mobile No. "required><br><br></td>
</tr>

<td><b>Adhar No:</b></td>
    <td> <input type="number"  placeholder="enter your Adhar No. "required><br><br></td>
</tr>

<tr>
    <td><b>DOB:</b></td>
     <td><input type="date"  placeholder="enter your DOB" required><br><br></td>
</tr>

<tr>
   <td><b>Upload your photo:</b></td>
    <td><input type="file"  placeholder="" ><br><br></td>
</tr>
<tr>
    <td>  </td>
   <td><b><button type="submit">submit</button></b></td>
</tr>

    </form>
    </table>
    </center>
</body>
</html>
