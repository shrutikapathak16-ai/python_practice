<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration page</title>
</head>
<body>
<center>
    <h1> <b> User Registration Page For Job </b></h1><br><hr><br>

    <form action="" method="get">
        <table border="0">
    <tr>
        <td> Username : </td> 
       <td> <input type="name" name="username" placeholder="enter username"><br><br></td>
    </tr>

      <tr>
        <td>Address : </td>
        <td><textarea name="address" rows="1" cols="20" placeholder="enter adress"></textarea><br><br></td>
      </tr>

      <tr>
        <td>Gender : </td>

      <td>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female"> female
        <input type="radio" name="gender" value="other">other<br><br>
    </td></tr>

    <tr>
        <td> Skills : </td>
        <td>

        python:<input type="checkbox" name="python" id="">
        html:<input type="checkbox" name="html" id="">
        css:<input type="checkbox" name="css" id="">
        java:<input type="checkbox" name="java" id=""><br><br></td>
        </tr>
        <tr>
        <td>Country : </td>
        <td><select name="country" id="">
                          <option value="india">INDIA</option>
                          <option value="us">US</option>
                          <option value="uk">UK</option>
                          <option value="france">FRANCE</option> </select><br><br>
                          </td></tr>

                          <tr>
                            <td>  </td>
                          <td><button type="register">Register</button></td>
                          </td>
                          </table>

    </form> 
    </center>
</body>
</html>
